<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הספירה לאחור - בר המצווה של אבישי</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&family=Orbitron:wght@700&display=swap');

        body { 
            margin: 0; 
            font-family: 'Heebo', sans-serif; 
            /* רקע עתידני - גרדיאנט כהה עמוק */
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0c29 50%, #000000 100%);
            color: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; overflow-x: hidden;
            background-attachment: fixed;
        }

        /* אפקט זוהר מונפש לכותרת */
        h1 { 
            font-size: 3rem; 
            margin-bottom: 5px; 
            text-align: center; 
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        h2 { 
            color: #a0aec0; 
            font-size: 1.3rem; 
            margin-bottom: 50px; 
            font-weight: 300; 
            text-align: center; 
            letter-spacing: 2px;
        }

        .timer-container { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; 
            width: 100%; max-width: 1000px; padding: 0 20px; box-sizing: border-box; 
        }

        /* עיצוב כרטיסיות באפקט זכוכית (Glassmorphism) */
        .card { 
            background: rgba(25, 25, 35, 0.4); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.2); 
            border-radius: 24px; 
            padding: 40px 20px; 
            text-align: center; flex: 1; min-width: 320px; 
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 242, 254, 0.4); 
        }

        .card h3 { 
            color: #e2e8f0; 
            margin-top: 0; font-size: 1.8rem; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            padding-bottom: 20px; margin-bottom: 30px; 
            font-weight: 400;
        }

        .countdown { 
            display: flex; justify-content: center; gap: 20px; direction: ltr; 
        }

        .time-box { 
            display: flex; flex-direction: column; align-items: center; width: 70px; 
        }

        /* מספרים עתידניים זוהרים */
        .number { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem; font-weight: 700; 
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 20px rgba(0, 242, 254, 0.4);
            margin-bottom: 5px;
        }

        .label { 
            font-size: 0.85rem; color: #a0aec0; 
            text-transform: uppercase; letter-spacing: 1px; 
            font-weight: 300;
        }

        .location { 
            font-size: 1rem; color: #cbd5e1; 
            margin-top: 35px; line-height: 1.6; 
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 600px) { 
            .number { font-size: 2.2rem; } 
            .card { min-width: 100%; padding: 30px 10px; } 
            h1 { font-size: 2.2rem; }
            .countdown { gap: 10px; }
            .time-box { width: 60px; }
        }
    </style>
</head>
<body>
    <h1>אבישי חוגג בר מצווה!</h1>
    <h2>הספירה לאחור החלה...</h2>

    <div class="timer-container">
        <!-- עלייה לתורה -->
        <div class="card">
            <h3>עלייה לתורה</h3>
            <div class="countdown">
                <div class="time-box"><span class="number" id="d1">00</span><span class="label">ימים</span></div>
                <div class="time-box"><span class="number" id="h1">00</span><span class="label">שעות</span></div>
                <div class="time-box"><span class="number" id="m1">00</span><span class="label">דקות</span></div>
                <div class="time-box"><span class="number" id="s1">00</span><span class="label">שניות</span></div>
            </div>
            <div class="location">5 בנובמבר 2026, 08:00<br>בית כנסת תפארת ישראל</div>
        </div>

        <!-- מסיבת בר המצווה -->
        <div class="card">
            <h3>מסיבת בר המצווה</h3>
            <div class="countdown">
                <div class="time-box"><span class="number" id="d2">00</span><span class="label">ימים</span></div>
                <div class="time-box"><span class="number" id="h2">00</span><span class="label">שעות</span></div>
                <div class="time-box"><span class="number" id="m2">00</span><span class="label">דקות</span></div>
                <div class="time-box"><span class="number" id="s2">00</span><span class="label">שניות</span></div>
            </div>
            <div class="location">16 בנובמבר 2026, 19:00<br>שונס אירועים</div>
        </div>
    </div>

    <script>
        // תאריכים מתוך היומן
        const target1 = new Date("2026-11-05T08:00:00").getTime();
        const target2 = new Date("2026-11-16T19:00:00").getTime();

        function updateTimer(target, prefix) {
            const now = new Date().getTime();
            const diff = target - now;

            if (diff < 0) {
                document.getElementById('d' + prefix).parentElement.parentElement.innerHTML = '<h3 style="color:#00f2fe; margin:0; font-size:2.5rem; text-shadow: 0 0 15px rgba(0, 242, 254, 0.8);">מזל טוב!</h3>';
                return;
            }

            document.getElementById('d' + prefix).innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('h' + prefix).innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('m' + prefix).innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('s' + prefix).innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }

        setInterval(() => {
            updateTimer(target1, '1');
            updateTimer(target2, '2');
        }, 1000);
        
        updateTimer(target1, '1');
        updateTimer(target2, '2');
    </script>
</body>
</html>
